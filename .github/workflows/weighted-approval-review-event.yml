name: weighted-approval-review-event
run-name: weighted-approval-review-event:${{ github.event.pull_request.number }}

on:
  # Automatic triggers are off in this fork: the harness workflows need
  # upstream infrastructure this repository does not have, and only the
  # desktop release runs on its own. Run this by hand when it is needed.
  workflow_dispatch:

permissions: {}

jobs:
  record-review-event:
    name: record weighted approval review event
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record review event
        run: echo 'Recorded a weighted approval review event.'
